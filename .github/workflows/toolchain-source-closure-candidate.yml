name: Verify pinned toolchain source closures (inventory only)

on:
  push:
    branches:
      - work/toolchain-source-closure-candidates-20261016
      - work/bootstrap-compatibility-20261019
    paths:
      - .github/workflows/toolchain-source-closure-candidate.yml
      - scripts/resolve-pinned-termux-recipe-closure.py
      - scripts/test-pinned-termux-recipe-closure.sh
      - scripts/test-toolchain-candidate-source-closures.sh
      - scripts/test-toolchain-source-readiness.sh
      - scripts/inspect-gradle-source-archive.py
      - scripts/tests/test_gradle_source_archive_inspection.py
      - scripts/verify-toolchain-source-readiness.py
      - termux-package-source-scope.json
      - toolchain-candidate-source-closure-locks.json
      - toolchain-candidate-source-closures/**
      - toolchain-source-readiness-inventory.json
      - docs/evidence/gradle-source-bootstrap-inspection.json
      - docs/evidence/gradle-source-bootstrap-assessment.json
      - docs/evidence/gradle-source-build-host-success.json
      - docs/TOOLCHAIN_SOURCE_GAPS_RU.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/toolchain-source-closure-candidate.yml
      - scripts/resolve-pinned-termux-recipe-closure.py
      - scripts/test-pinned-termux-recipe-closure.sh
      - scripts/test-toolchain-candidate-source-closures.sh
      - scripts/test-toolchain-source-readiness.sh
      - scripts/inspect-gradle-source-archive.py
      - scripts/tests/test_gradle_source_archive_inspection.py
      - scripts/verify-toolchain-source-readiness.py
      - termux-package-source-scope.json
      - toolchain-candidate-source-closure-locks.json
      - toolchain-candidate-source-closures/**
      - toolchain-source-readiness-inventory.json
      - docs/evidence/gradle-source-bootstrap-inspection.json
      - docs/evidence/gradle-source-bootstrap-assessment.json
      - docs/evidence/gradle-source-build-host-success.json
      - docs/TOOLCHAIN_SOURCE_GAPS_RU.md

permissions:
  contents: read

concurrency:
  group: aib-toolchain-source-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source-closure-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TERMUX_SOURCE_PIN: 505e06ef0c8dbd7611abfb90e9eb60826dcd01d7
    steps:
      - name: Check out candidate branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact locked Termux source
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/termux-packages"
          mkdir -p "$source_dir"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/termux/termux-packages.git
          git -C "$source_dir" fetch --no-tags --depth=1 origin "$TERMUX_SOURCE_PIN"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$TERMUX_SOURCE_PIN"
          test -z "$(git -C "$source_dir" status --porcelain=v1)"
      - name: Verify source inventory locks and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/resolve-pinned-termux-recipe-closure.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          bash -n scripts/test-pinned-termux-recipe-closure.sh scripts/test-toolchain-candidate-source-closures.sh scripts/test-toolchain-source-readiness.sh
          bash scripts/test-pinned-termux-recipe-closure.sh
          bash scripts/test-toolchain-candidate-source-closures.sh "$RUNNER_TEMP/termux-packages"
          bash scripts/test-toolchain-source-readiness.sh "$RUNNER_TEMP/termux-packages"
          {
            echo '## Toolchain source-closure inventory (metadata only)'
            echo
            echo '| Profile | Runtime packages | Dependency alternatives |'
            echo '|---|---:|---:|'
            python3 - toolchain-candidate-source-closure-locks.json <<'PY'
          import json, pathlib, sys
          lock=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for name, profile in lock["profiles"].items():
              print(f"| `{name}` | {profile['packageCount']} | {profile['dependencyAlternativeCount']} |")
          PY
            echo
            echo '## Missing toolchain readiness (not a package candidate)'
            python3 - toolchain-source-readiness-inventory.json <<'PY'
          import json, pathlib, sys
          inventory=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for name, profile in inventory["profiles"].items():
              print(f"- `{name}`: candidate eligible = `{str(profile['candidateEligible']).lower()}`; status = {profile['status']}")
          PY
            echo
            echo 'Package build / binary candidate audit / signed APT / candidate artifact / Android install / rollback: NOT RUN. The separate Gradle 9.8.2 source-build artifact is host-only; production publication and app-side installation remain blocked.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck pinned Gradle source ZIP without running the wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/gradle-9.8.2-src.zip"
          sidecar="$RUNNER_TEMP/gradle-9.8.2-src.zip.sha256"
          report="$RUNNER_TEMP/gradle-source-bootstrap-inspection.json"
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --max-time 240 \
            --output "$archive" https://services.gradle.org/distributions/gradle-9.8.2-src.zip
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --max-time 60 \
            --output "$sidecar" https://services.gradle.org/distributions/gradle-9.8.2-src.zip.sha256
          test "$(awk 'NR==1 {print $1}' "$sidecar")" = \
            96c9aba0564daa2998f578b589eba9ae1f6656e368fde85f7132e05321bab553
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/inspect-gradle-source-archive.py \
            --archive "$archive" --output "$report"
          cmp --silent "$report" docs/evidence/gradle-source-bootstrap-inspection.json
          {
            echo '## Gradle source archive bootstrap inspection (no wrapper execution)'
            echo
            echo '- Source archive checksum and ZIP CRC: PASS.'
            echo '- Wrapper points to a prebuilt Gradle 9.8.1 binary distribution without distributionSha256Sum.'
            echo '- This archive-inspection step did not execute the wrapper or run a source build; a separate host-only Gradle 9.8.2 source-build result is recorded in `docs/evidence/gradle-source-build-host-success.json`.'
            echo '- Package, feed, Android/Bionic runtime, and qualification: NOT RUN.'
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f -- "$archive" "$sidecar"
      - name: Verify official Gradle source-build guide without fetching Gradle binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          guide="$RUNNER_TEMP/gradle-9.8.2-CONTRIBUTING.md"
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --max-time 60 \
            --output "$guide" https://raw.githubusercontent.com/gradle/gradle/v9.8.2/CONTRIBUTING.md
          printf '%s  %s\n' \
            ecd3a59475130cf9376b0050408e47aacb7a78ab83182fd17c2ef0f362254751 "$guide" \
            | sha256sum --check --status
          grep -Fq './gradlew :distributions-full:binDistributionZip' "$guide"
          grep -Fq '**version 25**' "$guide"
          {
            echo '## Official Gradle source-build instruction (pinned documentation only)'
            echo
            echo '- The v9.8.2 contributor guide hash and documented source-build command match the assessment.'
            echo '- The documented command invokes the wrapper; this job did not run it or fetch any Gradle binary distribution.'
            echo '- A separate CI run built the host-only distribution using a verified build-only bootstrap; package, feed signing, Android/Bionic runtime, and qualification remain NOT RUN.'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f -- "$guide"
      - name: Remove only this job's temporary source checkout
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/termux-packages"
