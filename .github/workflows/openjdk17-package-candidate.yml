name: Build and verify pinned OpenJDK 17 package closure (no publication)

on:
  push:
    branches:
      - work/openjdk17-candidate-20261017
    paths:
      - .github/workflows/openjdk17-package-candidate.yml
      - openjdk17-candidate-package-set.json
      - termux-package-source-scope.json
      - scripts/resolve-pinned-termux-recipe-closure.py
      - scripts/test-pinned-termux-recipe-closure.sh
      - scripts/create-ephemeral-feed-signing-key.sh
      - scripts/create-signed-feed-release.sh
      - scripts/test-signed-feed-smoke.sh
      - scripts/test-apt-candidate.sh
      - scripts/verify-candidate-dependency-closure.py
      - scripts/test-candidate-feed-policy.sh
      - scripts/test-candidate-dependency-closure.sh
      - termux-private-package-kit/openjdk17/**
      - termux-private-package-kit/make-v476/patch_properties.py

permissions:
  contents: read

concurrency:
  group: aib-openjdk17-package-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-audit-and-test-openjdk17-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TERMUX_SOURCE_PIN: 505e06ef0c8dbd7611abfb90e9eb60826dcd01d7
      TERMUX_BUILDER_IMAGE_REF: ghcr.io/termux/package-builder@sha256:44999857244619e25bc8e3427904a16d36cc0c0e087704af039e5bdf94814ac9
      AIB_PINNED_SOURCE_ROOT: ${{ runner.temp }}/termux-packages
      APP_DATA_DIR: /data/user/0/com.karat.aibuilder
      TERMUX_PREFIX: /data/user/0/com.karat.aibuilder/files/usr

    steps:
      - name: Checkout candidate branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install isolated signing and index tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg dpkg-dev

      - name: Checkout exact locked Termux source
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/termux-packages"
          mkdir -p "$source_dir"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/termux/termux-packages.git
          git -C "$source_dir" fetch --no-tags --depth=1 origin "$TERMUX_SOURCE_PIN"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$TERMUX_SOURCE_PIN"
          test -z "$(git -C "$source_dir" status --porcelain=v1)"

      - name: Run policy, syntax, candidate and unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          kit=termux-private-package-kit/openjdk17
          bash -n scripts/create-ephemeral-feed-signing-key.sh scripts/create-signed-feed-release.sh scripts/test-signed-feed-smoke.sh scripts/test-apt-candidate.sh "$kit/build-openjdk17-private-aarch64.sh"
          python3 -m py_compile scripts/resolve-pinned-termux-recipe-closure.py scripts/verify-candidate-dependency-closure.py "$kit/audit_openjdk17_closure.py" "$kit/validate_openjdk17_feed.py"
          python3 -m unittest discover -s "$kit/tests" -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/pkg-config-v0.29.2/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/wget-v1.25.0/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/curl-v8.23.0/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/gh-v2.102.0/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/git-v2.56.0/tests -p 'test_*.py' -v
          ./scripts/test-candidate-feed-policy.sh
          ./scripts/test-candidate-dependency-closure.sh
          bash ./scripts/test-pinned-termux-recipe-closure.sh
          ./termux-private-package-kit/make-v476/verify-kit.sh
          ./scripts/test-signed-feed-smoke.sh

      - name: Resolve and verify the exact OpenJDK 17 source closure (metadata only)
        shell: bash
        run: |
          set -Eeuo pipefail
          closure="$RUNNER_TEMP/aib-openjdk17-source-closure.json"
          python3 scripts/resolve-pinned-termux-recipe-closure.py \
            --source-root "$RUNNER_TEMP/termux-packages" \
            --scope "$GITHUB_WORKSPACE/termux-package-source-scope.json" \
            --profile openjdk17-candidate > "$closure"
          test "$(sha256sum "$closure" | awk '{print $1}')" = 378bf846bf86255a89c94510b4cb52a945b22e1df06c3624919badd85f6c402a
          test "$(sha256sum openjdk17-candidate-package-set.json | awk '{print $1}')" = d99fb29de61771ca765cb3e36316090140a9cc6a8248ea141341ee22af80e750
          python3 - "$closure" openjdk17-candidate-package-set.json <<'PY'
          import json,pathlib,sys
          c=json.loads(pathlib.Path(sys.argv[1]).read_text());m=json.loads(pathlib.Path(sys.argv[2]).read_text());f=('recipePath','recipeSha256','packageType','parentPackage','parentDependencyRule','subpackagePath','subpackageSha256','sourceVersionExpression','sourceRevisionExpression','versionExpressionIsLiteral','revisionExpressionIsLiteral','dependencyGroups','recommendationGroupsNotIncludedInRequiredClosure')
          assert c['sourceCommit']==m['source']['commit'] and c['profile']=='openjdk17-candidate' and c['rootPackages']==['openjdk-17'] and c['packageCount']==36 and c['dependencyAlternativeCount']==46
          assert {x['name']:{k:x[k] for k in f} for x in c['packages']}=={x['name']:{k:x[k] for k in f} for x in m['packages']}
          PY

      - name: Pull digest-pinned official Termux builder
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          docker pull "$TERMUX_BUILDER_IMAGE_REF"
          docker image inspect "$TERMUX_BUILDER_IMAGE_REF" --format '{{.Id}}' >/dev/null

      - name: Build pinned closure and statically audit every candidate deb
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="$RUNNER_TEMP/aib-private-openjdk17-candidate-output"
          raw_log="$RUNNER_TEMP/aib-private-openjdk17-candidate-build.log"
          mkdir -p "$output_dir"
          set +e
          AIB_TERMUX_APP_DATA_DIR="$APP_DATA_DIR" \
          AIB_TERMUX_PREFIX="$TERMUX_PREFIX" \
          AIB_TERMUX_BUILDER_IMAGE_REF="$TERMUX_BUILDER_IMAGE_REF" \
            "$GITHUB_WORKSPACE/termux-private-package-kit/openjdk17/build-openjdk17-private-aarch64.sh" \
              "$RUNNER_TEMP/termux-packages" "$GITHUB_WORKSPACE/openjdk17-candidate-package-set.json" "$output_dir" >"$raw_log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::error title=OpenJDK 17 candidate build or audit failed::Exit $build_status; a sanitized log tail follows. No binary was uploaded."
            python3 - "$raw_log" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          for value,replacement in ((sys.argv[2],'<RUNNER_TEMP>'),(sys.argv[3],'<WORKSPACE>'),('/home/builder/termux-packages','<BUILDER_SOURCE>'),('/data/user/0/com.karat.aibuilder/files/usr','<MODELED_PREFIX>'),('/data/user/0/com.karat.aibuilder','<MODELED_APP_DATA>'),('/data/data/com.karat.aibuilder','<MODELED_APP_DATA>')): log=log.replace(value,replacement)
          log=re.sub(r'(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+|-----BEGIN [^-]*PRIVATE KEY-----|AIB_TERMUX_FEED_SIGNING_KEY|GITHUB_TOKEN|GH_TOKEN)','<REDACTED_SECRET>',log)
          print('--- sanitized last 100 build-log lines ---')
          for line in log.splitlines()[-100:]: print(line[:600])
          PY
            exit "$build_status"
          fi
          python3 - "$output_dir/build-result.json" "$output_dir/audit-report.json" <<'PY'
          import json,pathlib,sys
          build=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          audit=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert build['status']=='audit-passed; device-runtime-test-not-run'
          assert build['sourceCommit']=='505e06ef0c8dbd7611abfb90e9eb60826dcd01d7'
          assert build['sourceClosure']['profile']=='openjdk17-candidate' and build['sourceClosure']['rootPackages']==['openjdk-17'] and build['sourceClosure']['buildTargetPackage']=='openjdk-17' and build['sourceClosure']['packageCount']==36
          assert build['sourceClosure']['dependencyAlternativeCount']==46 and build['sourceClosure']['buildOnlyDependencies']==['cups','fontconfig','libxrandr','libxt','xorgproto','alsa-lib']
          assert len(build['packages'])==36 and audit['ok'] is True and audit['candidatePackageCount']==36
          assert audit['sourceClosurePackageCount']==36 and audit['sourceClosureDependencyAlternativeCount']==46
          assert build['installed'] is False and build['deviceSmokeTest']=='NOT RUN' and build['rollback']=='NOT RUN'
          assert build['prefixProvenance']=='ci-model-only; device-observation-not-run'
          print('PINNED_BUILD_AND_STATIC_AUDIT_OK packages=36 root=openjdk-17 ci_prefix=model_only device_install=NOT_RUN')
          PY

      - name: Create ephemeral signed candidate feed and simulate exact OpenJDK 17 APT closure
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="$RUNNER_TEMP/aib-private-openjdk17-candidate-output"
          feed="$RUNNER_TEMP/aib-openjdk17-candidate-feed"
          key_root="$RUNNER_TEMP/aib-openjdk17-candidate-signing-config"
          closure="$output_dir/source-closure.json"
          mkdir -p "$feed/dists/stable/main/binary-aarch64"
          ./scripts/create-ephemeral-feed-signing-key.sh "$key_root"
          export AIB_TERMUX_FEED_SIGNING_CONFIG_ROOT="$key_root"
          export GNUPGHOME="$key_root/gnupg"
          while IFS= read -r -d '' deb; do
            package="$(dpkg-deb -f "$deb" Package)"
            mkdir -p "$feed/pool/main/$package"
            cp -- "$deb" "$feed/pool/main/$package/"
          done < <(find "$output_dir/packages" -maxdepth 1 -type f -name '*.deb' -print0)
          (cd "$feed" && dpkg-scanpackages -m pool /dev/null > dists/stable/main/binary-aarch64/Packages)
          gzip -n -9c "$feed/dists/stable/main/binary-aarch64/Packages" > "$feed/dists/stable/main/binary-aarch64/Packages.gz"
          python3 ./scripts/verify-candidate-dependency-closure.py \
            --package-set openjdk17-candidate-package-set.json \
            --packages-index "$feed/dists/stable/main/binary-aarch64/Packages"
          ./scripts/create-signed-feed-release.sh "$feed" aarch64 >"$RUNNER_TEMP/aib-openjdk17-feed-signing.log" 2>&1 || {
            echo 'ERROR:OPENJDK17_CANDIDATE_FEED_SIGNING_OR_INTEGRITY_CHECK_FAILED' >&2; exit 2;
          }
          python3 termux-private-package-kit/openjdk17/validate_openjdk17_feed.py \
            --package-set openjdk17-candidate-package-set.json \
            --source-closure "$closure" \
            --feed-root "$feed" \
            --build-result "$output_dir/build-result.json" \
            --audit-report "$output_dir/audit-report.json" \
            --prefix "$TERMUX_PREFIX"
          AIB_APT_EXPECT_EXACT_SOURCE_CLOSURE=1 ./scripts/test-apt-candidate.sh "$feed" aarch64 openjdk-17 17.0.20 36
          ./scripts/test-signed-feed-smoke.sh
          openjdk_sha="$(python3 - "$output_dir/build-result.json" <<'PY'
          import json,pathlib,sys
          print(next(p['sha256'] for p in json.loads(pathlib.Path(sys.argv[1]).read_text())['packages'] if p['name']=='openjdk-17'))
          PY
          )"
          {
            echo '## Pinned OpenJDK 17 candidate closure (temporary CI-only feed)'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo '| Exact upstream commit, all 138 recipe/patch inputs and OpenJDK archive SHA-256 | PASS |'
            echo '| Exact OpenJDK tag object / peeled commit and three source license notice hashes | PASS |'
            echo '| Required OpenJDK 17 runtime closure | PASS; 46 dependency alternatives; 36 candidate packages; recommendations excluded |'
            echo '| App-private payload paths, licenses, AArch64 ELF and complete library providers | PASS; 36 package audits |'
            echo '| Exact candidate Depends/Pre-Depends closure | PASS; all runtime packages declared; no undeclared dependencies |'
            echo '| Ephemerally signed APT feed and simulated OpenJDK 17 install | PASS; install not performed |'
            echo '| OpenJDK 17 package SHA-256 | `'$openjdk_sha'` |'
            echo '| Device install / rollback | NOT RUN |'
            echo '| Public artifact / production feed / Pages / GitHub Release | NONE / BLOCKED |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary source, package, signature and signing material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf -- \
            "$RUNNER_TEMP/termux-packages" \
            "$RUNNER_TEMP/aib-private-openjdk17-candidate-output" \
            "$RUNNER_TEMP/aib-private-openjdk17-candidate-build.log" \
            "$RUNNER_TEMP/aib-openjdk17-candidate-feed" \
            "$RUNNER_TEMP/aib-openjdk17-candidate-signing-config" \
            "$RUNNER_TEMP/aib-openjdk17-feed-signing.log" \
            "$RUNNER_TEMP/aib-openjdk17-source-closure.json"
