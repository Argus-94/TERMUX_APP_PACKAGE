name: native-platform Java API JAR provenance audit (not a package)

on:
  push:
    branches:
      - work/bootstrap-compatibility-20261019
    paths:
      - .github/workflows/native-platform-java-jar-provenance.yml
      - scripts/audit-native-platform-java-jar-provenance.py
      - docs/evidence/gradle-9.8.2-distribution-republication.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-platform-java-jar-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java-jar-provenance:
    if: github.ref == 'refs/heads/work/bootstrap-compatibility-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Temurin JDK 8 required by pinned release build logic
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
          check-latest: false

      - name: Build and audit exact pinned Java API JAR
        id: provenance
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          python3 -u scripts/audit-native-platform-java-jar-provenance.py \
            --output "$RUNNER_TEMP/native-platform-java-jar-audit/artifact" \
            --work "$RUNNER_TEMP/native-platform-java-jar-audit/work"

      - name: Summarize provenance evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/native-platform-java-jar-audit/artifact/evidence.json"
          if [ -f "$evidence" ]; then
            python3 - "$evidence" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          e = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("## Native-platform Java API JAR provenance audit")
          print()
          print(f"**Outcome:** `{e.get('outcome')}` — isolated source audit only")
          print(f"**Pinned source:** `{e.get('source', {}).get('actualCommit')}` / tree `{e.get('source', {}).get('actualTree')}`")
          print(f"**Wrapper:** inspected; executed `{e.get('wrapper', {}).get('wrapperExecuted')}`; declared SHA-256 `{e.get('wrapper', {}).get('distributionSha256SumDeclared')}`")
          print(f"**Dependency verification:** `{e.get('build', {}).get('dependencyVerificationMode')}`; build exit `{e.get('build', {}).get('exitCode')}`")
          print(f"**Published JAR SHA-256:** `{e.get('publishedArtifact', {}).get('jarSha256Actual')}`")
          print(f"**Source-built JAR SHA-256:** `{e.get('build', {}).get('jarSha256')}`")
          print(f"**Gradle distribution JAR SHA-256:** `{e.get('gradleDistributionInput', {}).get('internalNativePlatformJarSha256')}`")
          for key, value in e.get("comparison", {}).items():
              print(f"**{key}:** byte-identical `{value.get('byteIdentical')}`, normalized contents identical `{value.get('normalizedEntryContentIdentical')}`")
          if e.get("blocker"):
              print()
              print(f"**Blocker:** `{e['blocker'].get('code')}` — {e['blocker'].get('message')}")
          print()
          print("No .deb, feed, APT simulation, Android/Bionic runtime, device test, or package eligibility is established by this workflow. Evidence and logs are retained for three days.")
          PY
          else
            echo 'Audit script did not produce evidence.json; inspect the step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JAR, evidence, license and logs (3-day retention)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-platform-java-jar-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/native-platform-java-jar-audit/artifact/
          if-no-files-found: error
          retention-days: 3
