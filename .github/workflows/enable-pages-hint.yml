name: Pages status check
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe feed URLs
        run: |
          set +e
          U1="https://argus-94.github.io/TERMUX_APP_PACKAGE/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$U1")
          echo "Pages Packages HTTP $code"
          if [ "$code" = "200" ]; then
            echo "OK: Pages is live"
            curl -s "$U1" | head -20
          else
            echo "FAIL: Pages not live ($code)"
            echo "Fix once: https://github.com/Argus-94/TERMUX_APP_PACKAGE/settings/pages"
            echo "  Option A: Source = GitHub Actions"
            echo "  Option B: Source = Deploy from branch → gh-pages → / (root)"
            exit 1
          fi
