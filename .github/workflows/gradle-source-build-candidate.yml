name: Build pinned Gradle source candidate (host-only)

on:
  push:
    branches:
      - work/bootstrap-compatibility-20261019
    paths:
      - .github/workflows/gradle-source-build-candidate.yml
      - scripts/inspect-gradle-source-archive.py
      - scripts/tests/test_gradle_source_archive_inspection.py
      - docs/evidence/gradle-source-bootstrap-*.json
      - docs/ANDROID_EVIDENCE_RU.md
      - docs/TOOLCHAIN_SOURCE_GAPS_RU.md
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gradle-source-build-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-build-host-only:
    if: github.ref == 'refs/heads/work/bootstrap-compatibility-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_URL: https://services.gradle.org/distributions/gradle-9.8.2-src.zip
      SOURCE_SHA256: 96c9aba0564daa2998f578b589eba9ae1f6656e368fde85f7132e05321bab553
      BOOTSTRAP_URL: https://services.gradle.org/distributions/gradle-9.8.1-bin.zip
      BOOTSTRAP_SHA256: dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
    steps:
      - name: Check out candidate branch without persisted credentials
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Adoptium Temurin JDK 25
        id: setup_java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          check-latest: false

      - name: Record and verify the host JDK
        id: host_jdk
        shell: bash
        run: |
          set -Eeuo pipefail
          status_dir="$RUNNER_TEMP/gradle-source-build-candidate-status"
          artifact_dir="$RUNNER_TEMP/gradle-source-build-candidate-artifact"
          mkdir -p "$status_dir" "$artifact_dir"
          if java -version >"$status_dir/host-java-version.txt" 2>&1; then
            printf '0\n' > "$status_dir/host-java-version.exit"
          else
            rc=$?
            printf '%s\n' "$rc" > "$status_dir/host-java-version.exit"
            cat "$status_dir/host-java-version.txt"
            exit "$rc"
          fi
          cat "$status_dir/host-java-version.txt"
          if grep -Eq 'version "25([.]|"|[-+])' "$status_dir/host-java-version.txt" \
              && grep -qi 'Temurin' "$status_dir/host-java-version.txt"; then
            printf '0\n' > "$status_dir/host-java-check.exit"
          else
            printf '1\n' > "$status_dir/host-java-check.exit"
            echo 'Expected an Adoptium Temurin JDK 25 on the host.' >&2
            exit 1
          fi

      - name: Verify source archive and trusted build-only bootstrap
        id: prepare
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        shell: bash
        run: |
          set -Eeuo pipefail
          status_dir="$RUNNER_TEMP/gradle-source-build-candidate-status"
          artifact_dir="$RUNNER_TEMP/gradle-source-build-candidate-artifact"
          mkdir -p "$status_dir" "$artifact_dir"

          run_check() {
            local name="$1"
            shift
            local log="$status_dir/${name}.log"
            local rc
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$status_dir/${name}.exit"
            if [ "$rc" -ne 0 ]; then
              cat "$log" >&2
              return "$rc"
            fi
          }

          source_archive="$RUNNER_TEMP/gradle-9.8.2-src.zip"
          source_sidecar="$RUNNER_TEMP/gradle-9.8.2-src.zip.sha256"
          source_report="$status_dir/source-inspection.json"
          run_check source_download curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 --output "$source_archive" "$SOURCE_URL"
          run_check source_sidecar_download curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 --output "$source_sidecar" "${SOURCE_URL}.sha256"
          source_sidecar_digest="$(awk 'NF { print $1; exit }' "$source_sidecar")"
          if [[ "$source_sidecar_digest" =~ ^[0-9a-f]{64}$ ]] && [ "$source_sidecar_digest" = "$SOURCE_SHA256" ]; then
            printf '0\n' > "$status_dir/source_sidecar_check.exit"
          else
            printf '1\n' > "$status_dir/source_sidecar_check.exit"
            echo 'Gradle source .sha256 sidecar differs from the fixed expected digest.' >&2
            exit 1
          fi
          printf '%s  %s\n' "$SOURCE_SHA256" "$source_archive" > "$status_dir/source.expected.sha256"
          run_check source_sha256 sha256sum --check --status "$status_dir/source.expected.sha256"
          run_check source_zip_crc unzip -tqq "$source_archive"
          run_check source_inspector env PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/inspect-gradle-source-archive.py --archive "$source_archive" --output "$source_report"
          run_check source_structure python3 -c '
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          archive = report["archive"]
          assert archive["entryCount"] == 47569, archive
          assert archive["duplicateEntryCount"] == 0, archive
          assert archive["symlinkEntryCount"] == 0, archive
          assert archive["crcCheck"] == "PASS", archive
          assert archive["sha256"] == "96c9aba0564daa2998f578b589eba9ae1f6656e368fde85f7132e05321bab553", archive
          assert report["wrapper"]["distributionUrl"] == "https://services.gradle.org/distributions/gradle-9.8.1-bin.zip", report["wrapper"]
          assert report["wrapper"]["distributionSha256Sum"] is None, report["wrapper"]
          assert report["bootstrap"]["wrapperExecuted"] is False, report["bootstrap"]
          ' "$source_report"

          source_extract="$RUNNER_TEMP/gradle-source"
          mkdir -p "$source_extract"
          run_check source_extract unzip -q "$source_archive" -d "$source_extract"
          source_root="$source_extract/gradle-9.8.2"
          test -f "$source_root/gradle/verification-metadata.xml"
          run_check source_version python3 -c 'import pathlib, sys; version = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").strip(); assert version == "9.8.2", version' "$source_root/version.txt"

          bootstrap_archive="$RUNNER_TEMP/gradle-9.8.1-bin.zip"
          bootstrap_sidecar="$RUNNER_TEMP/gradle-9.8.1-bin.zip.sha256"
          run_check bootstrap_download curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 --output "$bootstrap_archive" "$BOOTSTRAP_URL"
          run_check bootstrap_sidecar_download curl --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 --output "$bootstrap_sidecar" "${BOOTSTRAP_URL}.sha256"
          bootstrap_sidecar_digest="$(awk 'NF { print $1; exit }' "$bootstrap_sidecar")"
          if [[ "$bootstrap_sidecar_digest" =~ ^[0-9a-f]{64}$ ]] && [ "$bootstrap_sidecar_digest" = "$BOOTSTRAP_SHA256" ]; then
            printf '0\n' > "$status_dir/bootstrap_sidecar_check.exit"
          else
            printf '1\n' > "$status_dir/bootstrap_sidecar_check.exit"
            echo 'Gradle bootstrap .sha256 sidecar differs from the fixed expected digest.' >&2
            exit 1
          fi
          printf '%s  %s\n' "$BOOTSTRAP_SHA256" "$bootstrap_archive" > "$status_dir/bootstrap.expected.sha256"
          run_check bootstrap_sha256 sha256sum --check --status "$status_dir/bootstrap.expected.sha256"
          run_check bootstrap_zip_crc unzip -tqq "$bootstrap_archive"
          bootstrap_extract="$RUNNER_TEMP/gradle-bootstrap"
          mkdir -p "$bootstrap_extract"
          run_check bootstrap_extract unzip -q "$bootstrap_archive" -d "$bootstrap_extract"
          bootstrap_gradle="$bootstrap_extract/gradle-9.8.1/bin/gradle"
          test -x "$bootstrap_gradle"
          run_check bootstrap_version "$bootstrap_gradle" --version
          cp "$status_dir/bootstrap_version.log" "$status_dir/bootstrap-version.txt"
          if grep -Fxq 'Gradle 9.8.1' "$status_dir/bootstrap-version.txt"; then
            printf '0\n' > "$status_dir/bootstrap_version_check.exit"
          else
            printf '1\n' > "$status_dir/bootstrap_version_check.exit"
            echo 'Verified bootstrap executable did not report Gradle 9.8.1.' >&2
            exit 1
          fi

      - name: Build the Gradle 9.8.2 binary distribution from verified sources
        id: source_build
        if: steps.prepare.outcome == 'success'
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        shell: bash
        run: |
          set -Eeuo pipefail
          status_dir="$RUNNER_TEMP/gradle-source-build-candidate-status"
          bootstrap_gradle="$RUNNER_TEMP/gradle-bootstrap/gradle-9.8.1/bin/gradle"
          source_root="$RUNNER_TEMP/gradle-source/gradle-9.8.2"
          build_log="$status_dir/source-build.log"
          # Official module-identity defaults to a timestamped snapshot root/version,
          # while the ZIP filename uses baseVersion. Select unchanged version.txt=9.8.2
          # through its supported finalRelease property; this target never publishes.
          command=("$bootstrap_gradle" -p "$source_root" :distributions-full:binDistributionZip -PfinalRelease=true
            --no-daemon --no-parallel --max-workers=2 --stacktrace
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8')
          printf '%q ' "${command[@]}" > "$status_dir/source-build-command.txt"
          printf '\n' >> "$status_dir/source-build-command.txt"
          set +e
          "${command[@]}" 2>&1 | tee "$build_log"
          build_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$build_rc" > "$status_dir/source_build.exit"
          if [ "$build_rc" -ne 0 ]; then
            exit "$build_rc"
          fi

      - name: Audit the generated host distribution
        id: validate_distribution
        if: steps.source_build.outcome == 'success'
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        shell: bash
        run: |
          set -Eeuo pipefail
          status_dir="$RUNNER_TEMP/gradle-source-build-candidate-status"
          artifact_dir="$RUNNER_TEMP/gradle-source-build-candidate-artifact"
          source_root="$RUNNER_TEMP/gradle-source/gradle-9.8.2"
          audit_root="$RUNNER_TEMP/gradle-distribution-audit"
          matches_file="$status_dir/distribution-matches.txt"
          find "$source_root" -type f -name 'gradle-9.8.2-bin.zip' -print | sort > "$matches_file"
          mapfile -t distributions < "$matches_file"
          if [ "${#distributions[@]}" -ne 1 ]; then
            printf '1\n' > "$status_dir/distribution_locate.exit"
            echo "Expected exactly one gradle-9.8.2-bin.zip; found ${#distributions[@]}." >&2
            cat "$matches_file" >&2
            exit 1
          fi
          printf '0\n' > "$status_dir/distribution_locate.exit"
          distribution="${distributions[0]}"
          unzip -tqq "$distribution"
          printf '0\n' > "$status_dir/distribution_zip_crc.exit"
          mkdir -p "$audit_root"
          unzip -q "$distribution" -d "$audit_root"
          printf '0\n' > "$status_dir/distribution_extract.exit"
          generated_gradle="$audit_root/gradle-9.8.2/bin/gradle"
          if [ ! -x "$generated_gradle" ]; then
            printf '1\n' > "$status_dir/distribution_launcher_check.exit"
            {
              printf 'Expected executable generated launcher was not found: %s\n' "$generated_gradle"
              echo 'Actual generated launcher candidates (mode and path):'
              find "$audit_root" -maxdepth 3 -type f -path '*/bin/gradle' -exec stat -c '%a %n' {} \;
            } > "$status_dir/distribution-audit-error.txt"
            cat "$status_dir/distribution-audit-error.txt" >&2
            exit 1
          fi
          printf '0\n' > "$status_dir/distribution_launcher_check.exit"
          if "$generated_gradle" --version > "$status_dir/distribution-version.txt" 2>&1; then
            printf '0\n' > "$status_dir/distribution_version.exit"
          else
            rc=$?
            printf '%s\n' "$rc" > "$status_dir/distribution_version.exit"
            {
              printf 'Generated launcher --version returned exit code %s.\n' "$rc"
              cat "$status_dir/distribution-version.txt"
            } > "$status_dir/distribution-audit-error.txt"
            cat "$status_dir/distribution-audit-error.txt" >&2
            exit "$rc"
          fi
          if grep -Fxq 'Gradle 9.8.2' "$status_dir/distribution-version.txt"; then
            printf '0\n' > "$status_dir/distribution_version_check.exit"
          else
            printf '1\n' > "$status_dir/distribution_version_check.exit"
            {
              echo 'Generated distribution did not report Gradle 9.8.2.'
              cat "$status_dir/distribution-version.txt"
            } > "$status_dir/distribution-audit-error.txt"
            cat "$status_dir/distribution-audit-error.txt" >&2
            exit 1
          fi
          cp "$distribution" "$artifact_dir/gradle-9.8.2-bin.zip"
          cp "$status_dir/distribution-version.txt" "$artifact_dir/distribution-version.txt"

      - name: Write evidence and summarize the result
        id: evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.validate_distribution.outcome }}
          HOST_JDK_OUTCOME: ${{ steps.host_jdk.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          status = temp / "gradle-source-build-candidate-status"
          artifact = temp / "gradle-source-build-candidate-artifact"
          artifact.mkdir(parents=True, exist_ok=True)
          source_archive = temp / "gradle-9.8.2-src.zip"
          source_sidecar = temp / "gradle-9.8.2-src.zip.sha256"
          bootstrap_archive = temp / "gradle-9.8.1-bin.zip"
          bootstrap_sidecar = temp / "gradle-9.8.1-bin.zip.sha256"
          source_report_path = status / "source-inspection.json"
          output_archive = artifact / "gradle-9.8.2-bin.zip"
          build_log = status / "source-build.log"

          def sha256(path):
              if not path.is_file():
                  return None
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def sidecar_digest(path):
              if not path.is_file():
                  return None
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  fields = line.split()
                  if fields:
                      return fields[0]
              return None

          def exit_code(name):
              path = status / (name + ".exit")
              if not path.is_file():
                  return None
              try:
                  return int(path.read_text(encoding="utf-8").strip())
              except ValueError:
                  return None

          def text(path):
              return path.read_text(encoding="utf-8", errors="replace") if path.is_file() else None

          source_report = None
          if source_report_path.is_file():
              try:
                  source_report = json.loads(source_report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  source_report = None
              shutil.copy2(source_report_path, artifact / "source-inspection.json")
          for name in ("source-build.log", "bootstrap-version.txt", "distribution-version.txt",
                       "host-java-version.txt", "source-build-command.txt", "distribution-matches.txt",
                       "distribution-audit-error.txt"):
              path = status / name
              if path.is_file():
                  shutil.copy2(path, artifact / name)

          raw_log = text(build_log) or ""
          first_error = None
          lines = raw_log.splitlines()
          for index, line in enumerate(lines):
              if line.strip() == "* What went wrong:":
                  first_error = "\n".join(lines[index:index + 12]).rstrip()
                  break
          if first_error is None:
              markers = re.compile(r"(?:^e: |^\* What went wrong:|^Execution failed for task |^Could not resolve |^Could not find |^FAILURE:|^Error:|^error:)")
              for line in lines:
                  if markers.search(line):
                      first_error = line
                      break

          checks = {
              name: exit_code(name)
              for name in (
                  "host-java-version", "host-java-check", "source_download", "source_sidecar_download",
                  "source_sidecar_check", "source_sha256", "source_zip_crc", "source_inspector",
                  "source_structure", "source_extract", "source_version", "bootstrap_download", "bootstrap_sidecar_download",
                  "bootstrap_sidecar_check", "bootstrap_sha256", "bootstrap_zip_crc", "bootstrap_extract",
                  "bootstrap_version", "bootstrap_version_check", "source_build", "distribution_locate",
                  "distribution_zip_crc", "distribution_extract", "distribution_launcher_check", "distribution_version",
                  "distribution_version_check",
              )
          }
          output_ok = exit_code("distribution_version_check") == 0 and output_archive.is_file()
          source_details = {
              "url": "https://services.gradle.org/distributions/gradle-9.8.2-src.zip",
              "sha256SidecarUrl": "https://services.gradle.org/distributions/gradle-9.8.2-src.zip.sha256",
              "expectedSha256": "96c9aba0564daa2998f578b589eba9ae1f6656e368fde85f7132e05321bab553",
              "sidecarSha256": sidecar_digest(source_sidecar),
              "actualSha256": sha256(source_archive),
              "versionTxt": text(temp / "gradle-source/gradle-9.8.2/version.txt"),
              "versionSelection": "official -PfinalRelease=true selects unchanged source version.txt=9.8.2; this rebuilt host output is not an official Gradle release or a package/feed candidate",
              "inspectionScope": "archive-only checks performed before bootstrap download and source build; inspector bootstrap fields are local to that inspection",
              "inspection": source_report,
          }
          bootstrap_details = {
              "url": "https://services.gradle.org/distributions/gradle-9.8.1-bin.zip",
              "sha256SidecarUrl": "https://services.gradle.org/distributions/gradle-9.8.1-bin.zip.sha256",
              "expectedSha256": "dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f",
              "sidecarSha256": sidecar_digest(bootstrap_sidecar),
              "actualSha256": sha256(bootstrap_archive),
              "role": "verified build-only host bootstrap; never included in an app payload or feed",
              "versionOutput": text(status / "bootstrap-version.txt"),
          }
          build_command = [
              str(temp / "gradle-bootstrap/gradle-9.8.1/bin/gradle"),
              "-p", str(temp / "gradle-source/gradle-9.8.2"),
              ":distributions-full:binDistributionZip", "-PfinalRelease=true", "--no-daemon", "--no-parallel",
              "--max-workers=2", "--stacktrace",
              "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
          ]
          evidence = {
              "schemaVersion": 1,
              "result": "SOURCE_BUILD_SUCCESS_HOST_ONLY" if output_ok else "SOURCE_BUILD_NOT_VERIFIED_OR_FAILED",
              "run": {
                  "url": os.environ.get("RUN_URL"),
                  "ref": os.environ.get("RUN_REF"),
                  "commit": os.environ.get("RUN_SHA"),
              },
              "actions": {
                  "checkout": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
                  "setupJava": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
                  "uploadArtifact": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
              },
              "runner": {
                  "image": "ubuntu-24.04",
                  "javaVersionOutput": text(status / "host-java-version.txt"),
                  "prepareStep": os.environ.get("PREPARE_OUTCOME"),
                  "hostJdkStep": os.environ.get("HOST_JDK_OUTCOME"),
                  "sourceBuildStep": os.environ.get("BUILD_OUTCOME"),
                  "distributionAuditStep": os.environ.get("DISTRIBUTION_OUTCOME"),
              },
              "source": source_details,
              "bootstrap": bootstrap_details,
              "build": {
                  "commandArgv": build_command,
                  "commandExitCode": exit_code("source_build"),
                  "firstError": first_error,
                  "logPathInArtifact": "source-build.log" if build_log.is_file() else None,
              },
              "checksExitCodes": checks,
              "outputDistribution": {
                  "filename": "gradle-9.8.2-bin.zip" if output_ok else None,
                  "sha256": sha256(output_archive) if output_ok else None,
                  "sizeBytes": output_archive.stat().st_size if output_ok else None,
                  "integrityCheckExitCode": exit_code("distribution_zip_crc"),
                  "generatedVersionOutput": text(status / "distribution-version.txt"),
                  "auditError": text(status / "distribution-audit-error.txt"),
                  "hostOnly": True,
              },
              "scope": {
                  "buildTarget": "host binary distribution only",
                  "androidBionicRuntime": "NOT_VERIFIED",
                  "packageBuilt": False,
                  "feedPublishedOrSigned": False,
                  "candidateOrProductionGateEnabled": False,
                  "productionAllowed": False,
              },
          }
          evidence_path = artifact / "gradle-source-build-evidence.json"
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines_out = ["## Gradle 9.8.2 source build candidate — host-only", ""]
          if output_ok:
              lines_out += [
                  "**Result: source build and host distribution audit passed.**",
                  "",
                  f"- Output SHA-256: `{sha256(output_archive)}`",
                  f"- Output size: `{output_archive.stat().st_size}` bytes",
                  "- Source and bootstrap archives: fixed checksum, sidecar, ZIP integrity, and structural checks passed.",
                  "- Generated `gradle --version`: verified as Gradle 9.8.2 on the host JDK.",
                  "- Android/Bionic runtime: **NOT VERIFIED**. Package/feed/production gates remain false.",
                  f"- [Workflow run and artifact listing]({os.environ.get('RUN_URL')})",
              ]
          else:
              lines_out += [
                  "**Result: source build candidate did not pass all checks; no qualified distribution is claimed.**",
                  "",
                  f"- Prepare step: `{os.environ.get('PREPARE_OUTCOME')}`; source build step: `{os.environ.get('BUILD_OUTCOME')}`; distribution audit: `{os.environ.get('DISTRIBUTION_OUTCOME')}`.",
                  f"- Evidence JSON: `gradle-source-build-evidence.json` in the uploaded run artifact (when upload succeeds).",
                  f"- [Workflow run and failure logs]({os.environ.get('RUN_URL')})",
              ]
              if first_error:
                  lines_out += ["", "### First Gradle build error (verbatim)", "", "```text", first_error, "```"]
              elif os.environ.get("BUILD_OUTCOME") == "failure":
                  lines_out += ["", "Gradle returned a non-zero exit but no recognized error marker was extracted; inspect the preserved `source-build.log` in the run artifact."]
              audit_error = text(status / "distribution-audit-error.txt")
              if audit_error:
                  lines_out += ["", "### Generated distribution audit error (verbatim)", "", "```text", audit_error.rstrip(), "```"]
          lines_out += ["", "This host build is not an Android/Bionic compatibility result and does not enable package, feed, signing, readiness, or production gates.", ""]
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines_out))
          PY

      - name: Upload evidence and host-only build output
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gradle-source-build-host-only-${{ github.run_id }}
          path: ${{ runner.temp }}/gradle-source-build-candidate-artifact/
          if-no-files-found: error
          retention-days: 7

  native-fallback-smoke-aarch64:
    name: Gradle 9.8.2 ARM64 native fallback smoke (glibc only)
    if: github.ref == 'refs/heads/work/bootstrap-compatibility-20261019'
    needs: source-build-host-only
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Download the verified source-built distribution artifact
        id: download_distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gradle-source-build-host-only-${{ github.run_id }}
          path: ${{ runner.temp }}/gradle-source-build-candidate-artifact

      - name: Set up Eclipse Temurin JDK 17
        id: setup_java17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Run isolated ARM64 native-fallback smoke and write evidence
        id: native_fallback_smoke
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import zipfile

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          input_dir = runner_temp / "gradle-source-build-candidate-artifact"
          artifact_dir = runner_temp / "gradle-arm64-native-fallback-artifact"
          logs_dir = artifact_dir / "logs"
          work_dir = runner_temp / "gradle-arm64-native-fallback-work"
          artifact_dir.mkdir(parents=True, exist_ok=True)
          logs_dir.mkdir(parents=True, exist_ok=True)
          failures = []
          checks = {}
          warnings = {}
          mutation = None
          source_evidence = None
          archive = input_dir / "gradle-9.8.2-bin.zip"
          evidence_path = artifact_dir / "gradle-arm64-native-fallback-evidence.json"
          source_evidence_path = input_dir / "gradle-source-build-evidence.json"

          def fail(message):
              failures.append(str(message))
              print("FAIL:", message, file=sys.stderr)

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def run(name, command, cwd=None, timeout=300):
              log_path = logs_dir / (name + ".log")
              try:
                  with log_path.open("w", encoding="utf-8") as log:
                      result = subprocess.run(
                          command, cwd=cwd, stdout=log, stderr=subprocess.STDOUT,
                          text=True, timeout=timeout, check=False,
                      )
                  rc = result.returncode
              except Exception as exc:
                  with log_path.open("a", encoding="utf-8") as log:
                      log.write(f"\nExecution error: {type(exc).__name__}: {exc}\n")
                  rc = 127
              output = log_path.read_text(encoding="utf-8", errors="replace")
              checks[name] = {"exitCode": rc, "log": f"logs/{log_path.name}"}
              print(f"--- {name} (exit {rc}) ---")
              print(output[-12000:])
              if rc != 0:
                  fail(f"{name} exited {rc}")
              return rc, output

          def skipped(name, reason):
              checks[name] = {"exitCode": None, "skipped": reason, "log": None}

          architecture = platform.machine()
          linux_platform = platform.system() == "Linux"
          if not linux_platform or architecture not in ("aarch64", "arm64"):
              fail(f"Expected Linux ARM64 runner; got {platform.system()} {architecture}")
          architecture_ok = linux_platform and architecture in ("aarch64", "arm64")

          java_home = pathlib.Path(os.environ.get("JAVA_HOME", "/nonexistent"))
          java_bin = java_home / "bin" / "java"
          java_rc, java_output = run("java-17-version", [str(java_bin), "-version"])
          java_ok = (
              java_rc == 0
              and bool(re.search(r'version "17(?:[.]|"|-)', java_output))
              and "Temurin" in java_output
          )
          if not java_ok:
              fail("Expected the configured Eclipse Temurin JDK 17")

          ldd_rc, ldd_output = run("glibc-identification", ["ldd", "--version"])
          glibc_identified = ldd_rc == 0 and any(marker in ldd_output for marker in ("GLIBC", "GNU libc", "GNU C Library"))
          if not glibc_identified:
              fail("Could not positively identify the runner's glibc runtime")

          input_archive_sha = None
          input_archive_size = None
          input_ok = False
          try:
              if not archive.is_file() or not source_evidence_path.is_file():
                  raise FileNotFoundError("downloaded source distribution or source evidence is missing")
              source_evidence = json.loads(source_evidence_path.read_text(encoding="utf-8"))
              if source_evidence.get("result") != "SOURCE_BUILD_SUCCESS_HOST_ONLY":
                  raise ValueError("source-build evidence does not report successful host-only build")
              if source_evidence.get("run", {}).get("commit") != os.environ.get("RUN_SHA"):
                  raise ValueError("source-build evidence commit differs from this workflow run commit")
              if source_evidence.get("outputDistribution", {}).get("hostOnly") is not True:
                  raise ValueError("source-build evidence does not mark the distribution host-only")
              input_archive_sha = sha256_file(archive)
              input_archive_size = archive.stat().st_size
              if input_archive_sha != source_evidence.get("outputDistribution", {}).get("sha256"):
                  raise ValueError("downloaded archive SHA-256 differs from source-build evidence")
              if input_archive_size != source_evidence.get("outputDistribution", {}).get("sizeBytes"):
                  raise ValueError("downloaded archive size differs from source-build evidence")
              with zipfile.ZipFile(archive) as bundle:
                  bad_member = bundle.testzip()
                  if bad_member is not None:
                      raise ValueError(f"Gradle distribution ZIP CRC check failed at {bad_member}")
                  names = bundle.namelist()
                  if len(names) != len(set(names)):
                      raise ValueError("Gradle distribution contains duplicate ZIP entries")
                  for name in names:
                      member = pathlib.PurePosixPath(name)
                      if member.is_absolute() or ".." in member.parts:
                          raise ValueError(f"unsafe distribution ZIP member: {name}")
              shutil.copy2(source_evidence_path, artifact_dir / "gradle-source-build-evidence.json")
              print(f"Verified input Gradle distribution SHA-256: {input_archive_sha} ({input_archive_size} bytes)")
              input_ok = True
          except Exception as exc:
              fail(f"source distribution verification failed: {type(exc).__name__}: {exc}")

          mutation_ok = False
          work_root = work_dir / "original-extract"
          copied_root = work_dir / "fallback-copy"
          if input_ok:
              try:
                  if work_dir.exists():
                      shutil.rmtree(work_dir)
                  work_root.mkdir(parents=True)
                  extract_rc, _ = run("distribution-extract", ["unzip", "-q", str(archive), "-d", str(work_root)])
                  if extract_rc != 0:
                      raise RuntimeError("could not extract the verified original distribution")
                  original_dist = work_root / "gradle-9.8.2"
                  original_launcher = original_dist / "bin" / "gradle"
                  if not original_launcher.is_file() or not os.access(original_launcher, os.X_OK):
                      raise ValueError("verified distribution has no executable gradle launcher")
                  shutil.copytree(original_dist, copied_root)
                  copied_launcher = copied_root / "bin" / "gradle"
                  original_archive_sha_before = sha256_file(archive)
                  source_jar_paths = sorted((original_dist / "lib").glob("native-platform-linux-aarch64-*.jar"))
                  copied_jar_paths = sorted((copied_root / "lib").glob("native-platform-linux-aarch64-*.jar"))
                  if not source_jar_paths or [p.name for p in source_jar_paths] != [p.name for p in copied_jar_paths]:
                      raise ValueError("expected matching Linux ARM64 native-platform JARs under lib/")

                  jar_records = []
                  removed_entries = []
                  for source_jar, copied_jar in zip(source_jar_paths, copied_jar_paths):
                      with zipfile.ZipFile(source_jar) as before:
                          infos = before.infolist()
                          names_before = [info.filename for info in infos]
                          if len(names_before) != len(set(names_before)):
                              raise ValueError(f"duplicate entry in {source_jar.name}")
                          before_hashes = {info.filename: sha256_bytes(before.read(info)) for info in infos}
                          tmp_jar = copied_jar.with_suffix(copied_jar.suffix + ".tmp")
                          removed_from_jar = []
                          with zipfile.ZipFile(tmp_jar, "w") as after:
                              after.comment = before.comment
                              for info in infos:
                                  payload = before.read(info)
                                  if info.filename.endswith(".so"):
                                      if "linux-aarch64" not in info.filename:
                                          raise ValueError(f"refusing to remove non-ARM64 shared object {info.filename}")
                                      removed_from_jar.append(info.filename)
                                      removed_entries.append({
                                          "jar": source_jar.name,
                                          "entry": info.filename,
                                          "sha256": sha256_bytes(payload),
                                          "sizeBytes": len(payload),
                                      })
                                      continue
                                  after.writestr(info, payload)
                          tmp_jar.replace(copied_jar)
                      with zipfile.ZipFile(copied_jar) as after:
                          infos_after = after.infolist()
                          after_hashes = {info.filename: sha256_bytes(after.read(info)) for info in infos_after}
                      expected_names = set(before_hashes) - set(removed_from_jar)
                      if set(after_hashes) != expected_names:
                          raise ValueError(f"unexpected JAR entry change in {source_jar.name}")
                      if any(before_hashes[name] != after_hashes[name] for name in expected_names):
                          raise ValueError(f"retained JAR payload changed in {source_jar.name}")
                      jar_records.append({
                          "name": source_jar.name,
                          "originalSha256": sha256_file(source_jar),
                          "fallbackCopySha256": sha256_file(copied_jar),
                          "originalEntryCount": len(before_hashes),
                          "retainedEntryCount": len(after_hashes),
                          "removedEntries": removed_from_jar,
                          "retainedEntryPayloadsByteIdentical": True,
                      })
                  if not removed_entries:
                      raise ValueError("no Linux ARM64 native .so entries were found to disable")

                  original_files = {p.relative_to(original_dist).as_posix(): p for p in original_dist.rglob("*") if p.is_file()}
                  copied_files = {p.relative_to(copied_root).as_posix(): p for p in copied_root.rglob("*") if p.is_file()}
                  if set(original_files) != set(copied_files):
                      raise ValueError("fallback copy has a different file inventory from the fresh extraction")
                  changed_paths = []
                  expected_changed = {p.relative_to(original_dist).as_posix() for p in source_jar_paths}
                  for relative in sorted(original_files):
                      if sha256_file(original_files[relative]) != sha256_file(copied_files[relative]):
                          changed_paths.append(relative)
                  if set(changed_paths) != expected_changed:
                      raise ValueError(f"unexpected changed distribution files: {changed_paths}")
                  original_archive_sha_after = sha256_file(archive)
                  if original_archive_sha_before != input_archive_sha or original_archive_sha_after != input_archive_sha:
                      raise ValueError("uploaded original distribution archive was modified")
                  mutation = {
                      "operation": "removed only Linux ARM64 native .so entries from copied native-platform JARs",
                      "originalDistributionArchiveSha256": input_archive_sha,
                      "originalDistributionArchiveSha256AfterMutation": original_archive_sha_after,
                      "originalArchiveUnmodified": True,
                      "targetJarCount": len(jar_records),
                      "jars": jar_records,
                      "removedNativeSharedObjects": removed_entries,
                      "changedDistributionFiles": changed_paths,
                      "onlyTargetJarsChanged": set(changed_paths) == expected_changed,
                      "allRetainedJarEntryPayloadsByteIdentical": all(r["retainedEntryPayloadsByteIdentical"] for r in jar_records),
                  }
                  (artifact_dir / "native-jar-mutation-manifest.json").write_text(
                      json.dumps(mutation, indent=2, sort_keys=True) + "\n", encoding="utf-8"
                  )
                  mutation_ok = True
                  print(f"Removed {len(removed_entries)} ARM64 Linux native .so entries from {len(jar_records)} copied JARs; original archive unchanged.")
              except Exception as exc:
                  fail(f"fallback-copy preparation or integrity check failed: {type(exc).__name__}: {exc}")
          else:
              skipped("distribution-extract", "source distribution verification failed")

          network_probe_script = r'''set -Eeuo pipefail
          if ip -4 route show default | grep -q .; then echo "Unexpected IPv4 default route" >&2; exit 90; fi
          if ip -6 route show default | grep -q .; then echo "Unexpected IPv6 default route" >&2; exit 91; fi
          links="$(ip -o link show | awk -F': ' '{print $2}' | sed 's/@.*//')"
          if [ "$links" != "lo" ]; then echo "Unexpected network interfaces: $links" >&2; exit 92; fi
          echo NETWORK_NAMESPACE_NO_EXTERNAL_ROUTE'''
          netns_probe_rc = None
          if architecture_ok and java_ok and mutation_ok:
              netns_probe_rc, _ = run("network-namespace-probe", [
                  "sudo", "-n", "unshare", "--net", "--", "env",
                  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                  "bash", "-c", network_probe_script,
              ])
          else:
              skipped("network-namespace-probe", "ARM64, JDK 17, or verified fallback-copy prerequisite failed")

          command_names = ["gradle-version", "default-help", "default-smoke", "no-watch-fs-help", "no-watch-fs-smoke"]
          if architecture_ok and java_ok and mutation_ok and netns_probe_rc == 0:
              project_dir = work_dir / "smoke-project"
              project_dir.mkdir(parents=True, exist_ok=True)
              (project_dir / "settings.gradle").write_text("rootProject.name = 'gradle-arm64-native-fallback-smoke'\n", encoding="utf-8")
              (project_dir / "build.gradle").write_text(
                  "plugins { id 'base' }\n"
                  "tasks.register('smoke') { doLast { println('NATIVE_FALLBACK_SMOKE_OK') } }\n",
                  encoding="utf-8",
              )
              gradle_user_home = work_dir / "gradle-user-home"
              gradle_user_home.mkdir(parents=True, exist_ok=True)
              run_in_netns_script = r'''set -Eeuo pipefail
          project_dir="$1"
          gradle_bin="$2"
          gradle_home="$3"
          shift 3
          if ip -4 route show default | grep -q . || ip -6 route show default | grep -q .; then
            echo "Network namespace unexpectedly has a default route" >&2
            exit 90
          fi
          links="$(ip -o link show | awk -F': ' '{print $2}' | sed 's/@.*//')"
          if [ "$links" != "lo" ]; then echo "Network namespace has external interfaces: $links" >&2; exit 92; fi
          echo NETWORK_NAMESPACE_NO_EXTERNAL_ROUTE
          cd "$project_dir"
          export GRADLE_USER_HOME="$gradle_home"
          export HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= http_proxy= https_proxy= all_proxy=
          exec "$gradle_bin" "$@"'''
              java_bin_dir = str(java_home / "bin")
              clean_path = java_bin_dir + ":/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              gradle_cmd_base = ["--no-daemon", "--offline", "--max-workers=1", "-Dorg.gradle.jvmargs=-Xmx512m"]
              tests = [
                  ("gradle-version", ["--version"]),
                  ("default-help", gradle_cmd_base + ["help"]),
                  ("default-smoke", gradle_cmd_base + ["smoke"]),
                  ("no-watch-fs-help", ["--no-watch-fs"] + gradle_cmd_base + ["help"]),
                  ("no-watch-fs-smoke", ["--no-watch-fs"] + gradle_cmd_base + ["smoke"]),
              ]
              for name, args in tests:
                  command = [
                      "sudo", "-n", "unshare", "--net", "--", "setpriv",
                      f"--reuid={os.getuid()}", f"--regid={os.getgid()}", "--clear-groups", "env",
                      f"JAVA_HOME={java_home}", f"GRADLE_USER_HOME={gradle_user_home}",
                      f"HOME={os.environ.get('HOME', '/tmp')}", f"PATH={clean_path}",
                      "bash", "-c", run_in_netns_script, "gradle-smoke",
                      str(project_dir), str(copied_launcher), str(gradle_user_home), *args,
                  ]
                  run(name, command, timeout=300)
          else:
              reason = "required ARM64/JDK17/mutation/network-isolation prerequisite failed"
              for name in command_names:
                  skipped(name, reason)

          warning_text = "There is no native integration with this operating environment"
          default_logs = [
              (logs_dir / "default-help.log"),
              (logs_dir / "default-smoke.log"),
          ]
          warning_matches = [p.name for p in default_logs if p.is_file() and warning_text in p.read_text(encoding="utf-8", errors="replace")]
          warnings["safeFallbackWarningObservedInDefaultFileWatching"] = bool(warning_matches)
          warnings["safeFallbackWarningText"] = warning_text
          warnings["logsContainingWarning"] = warning_matches
          if netns_probe_rc == 0 and not warning_matches:
              fail("expected Gradle's safe native-integration fallback warning was not observed in default-watch logs")

          command_ok = all(checks.get(name, {}).get("exitCode") == 0 for name in command_names)
          command_outputs = {
              name: (logs_dir / (name + ".log")).read_text(encoding="utf-8", errors="replace")
              if (logs_dir / (name + ".log")).is_file() else ""
              for name in command_names
          }
          if checks.get("gradle-version", {}).get("exitCode") == 0 and not any(
              line.strip() == "Gradle 9.8.2" for line in command_outputs["gradle-version"].splitlines()
          ):
              fail("ARM64 fallback-copy launcher did not report exactly Gradle 9.8.2")
          for name in ("default-help", "no-watch-fs-help"):
              if checks.get(name, {}).get("exitCode") == 0 and ("BUILD SUCCESSFUL" not in command_outputs[name] or ":help" not in command_outputs[name]):
                  fail(f"{name} did not show successful help task execution")
          for name in ("default-smoke", "no-watch-fs-smoke"):
              if checks.get(name, {}).get("exitCode") == 0 and ("BUILD SUCCESSFUL" not in command_outputs[name] or "NATIVE_FALLBACK_SMOKE_OK" not in command_outputs[name]):
                  fail(f"{name} did not show successful smoke task execution")

          source_run = source_evidence.get("run", {}) if isinstance(source_evidence, dict) else {}
          if not isinstance(source_run, dict):
              source_run = {}
          evidence = {
              "schemaVersion": 1,
              "result": "ARM64_NATIVE_FALLBACK_SMOKE_PASSED" if not failures and command_ok and mutation_ok else "ARM64_NATIVE_FALLBACK_SMOKE_FAILED_OR_NOT_VERIFIED",
              "run": {
                  "url": os.environ.get("RUN_URL"),
                  "ref": os.environ.get("RUN_REF"),
                  "commit": os.environ.get("RUN_SHA"),
              },
              "runner": {
                  "image": "ubuntu-24.04-arm",
                  "operatingSystem": platform.system(),
                  "machineArchitecture": architecture,
                  "glibcIdentified": glibc_identified,
                  "glibcIdentificationLog": "logs/glibc-identification.log",
                  "javaVersionOutput": java_output,
                  "javaSetupExpected": "Eclipse Temurin JDK 17",
                  "sourceBuildRunner": "ubuntu-24.04 x86_64; preserved existing host-build job",
              },
              "inputDistribution": {
                  "producerRun": source_run.get("url"),
                  "producerCommit": source_run.get("commit"),
                  "filename": archive.name,
                  "sha256": input_archive_sha,
                  "sizeBytes": input_archive_size,
                  "matchesProducerEvidence": input_ok,
                  "originalArchiveUnmodified": mutation.get("originalArchiveUnmodified") if mutation else False,
              },
              "fallbackMutation": mutation,
              "networkIsolation": {
                  "mechanism": "Linux network namespace created with sudo unshare --net; no default routes and loopback-only interface required for probe and each Gradle invocation",
                  "probeExitCode": netns_probe_rc,
                  "verifiedForEveryGradleInvocation": all(
                      checks.get(name, {}).get("exitCode") == 0
                      and "NETWORK_NAMESPACE_NO_EXTERNAL_ROUTE" in (logs_dir / (name + ".log")).read_text(encoding="utf-8", errors="replace")
                      for name in command_names
                      if (logs_dir / (name + ".log")).is_file()
                  ) and command_ok,
              },
              "commands": checks,
              "fallbackWarning": warnings,
              "scope": {
                  "runtimeTest": "Ubuntu Linux ARM64 with glibc; Gradle native Linux ARM64 .so entries removed only in a copied distribution",
                  "androidBionicRuntime": "NOT_VERIFIED",
                  "candidateEligible": False,
                  "packageAptEligible": False,
                  "feedEligible": False,
                  "packageBuilt": False,
                  "feedPublishedOrSigned": False,
                  "productionAllowed": False,
              },
              "failures": failures,
              "artifactFiles": [
                  "gradle-arm64-native-fallback-evidence.json",
                  "native-jar-mutation-manifest.json",
                  "gradle-source-build-evidence.json",
                  "logs/*.log",
              ],
          }
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary_lines = [
              "## Gradle 9.8.2 ARM64 native-fallback smoke — glibc only",
              "",
              f"**Result: {evidence['result']}**",
              "",
              f"- ARM64 runner: `{architecture}` on `ubuntu-24.04-arm`; JDK 17 check: `{java_ok}`.",
              f"- Input distribution SHA-256: `{input_archive_sha}`; copied JAR entry integrity: `{bool(mutation and mutation.get('allRetainedJarEntryPayloadsByteIdentical'))}`.",
              f"- Network namespace probe: `{netns_probe_rc}`; safe fallback warning observed: `{bool(warning_matches)}`.",
              "- Android/Bionic runtime: **NOT VERIFIED**. Candidate, package, feed, and production eligibility remain false.",
              f"- [Workflow run and artifacts]({os.environ.get('RUN_URL')})",
              "",
              "This test is Ubuntu/glibc ARM64 only; it does not validate Android Bionic.",
              "",
          ]
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n".join(summary_lines))
          if failures or not command_ok or not mutation_ok:
              sys.exit(1)
          PY

      - name: Upload ARM64 native-fallback logs and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gradle-arm64-native-fallback-${{ github.run_id }}
          path: ${{ runner.temp }}/gradle-arm64-native-fallback-artifact/
          if-no-files-found: error
          retention-days: 7
