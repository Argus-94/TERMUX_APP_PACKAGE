name: Build private AI Builder GNU Make 4.4.1-1

on:
  workflow_dispatch:
    inputs:
      app_data_dir:
        description: Exact applicationInfo.dataDir measured on installed AI Builder v476; public workflow inputs may be visible
        required: true
        type: string
      termux_prefix:
        description: Exact validated filesDir/usr prefix from installed AI Builder v476; do not guess
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-private-make:
    if: ${{ github.ref == 'refs/heads/work/gnu-make-4.4.1-1' }}
    uses: ./.github/workflows/build-private-make-v476.yml
    with:
      app_data_dir: ${{ inputs.app_data_dir }}
      termux_prefix: ${{ inputs.termux_prefix }}
    permissions:
      contents: read
