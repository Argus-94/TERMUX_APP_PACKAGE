# Автосборка aarch64 .deb под com.karat.aibuilder → apt/ → commit+push
name: Build Termux packages (auto)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      packages:
        description: "Пакеты через пробел (пусто = git openssh python)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: build-packages-auto
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_PACKAGES: "git openssh python"
  TERMUX_APP_ID: "com.karat.aibuilder"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Не пересобирать, если этот же workflow только что запушил apt/
    if: |
      github.event_name != 'push' ||
      (
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, 'ci: auto-build') &&
        github.actor != 'github-actions[bot]'
      )
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Checkout TERMUX_APP_PACKAGE
        uses: actions/checkout@v4
        with:
          path: repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Resolve package list
        id: pkgs
        run: |
          IN="${{ github.event.inputs.packages }}"
          if [ -n "$IN" ]; then
            echo "list=$IN" >> "$GITHUB_OUTPUT"
          else
            echo "list=${DEFAULT_PACKAGES}" >> "$GITHUB_OUTPUT"
          fi
          echo "Packages: $(cat "$GITHUB_OUTPUT")"

      - name: Clone termux-packages
        run: |
          set -e
          git clone --depth 1 https://github.com/termux/termux-packages.git tp
          PROP=tp/scripts/properties.sh
          if grep -q '^TERMUX_APP__PACKAGE_NAME=' "$PROP" 2>/dev/null; then
            sed -i "s|^TERMUX_APP__PACKAGE_NAME=.*|TERMUX_APP__PACKAGE_NAME=\"${TERMUX_APP_ID}\"|" "$PROP"
          else
            echo "TERMUX_APP__PACKAGE_NAME=\"${TERMUX_APP_ID}\"" >> "$PROP"
          fi
          grep TERMUX_APP__PACKAGE_NAME "$PROP"

      - name: Build packages via Docker
        working-directory: tp
        run: |
          set -e
          PKGS="${{ steps.pkgs.outputs.list }}"
          echo "Building: $PKGS"
          : > /tmp/debs.list
          for p in $PKGS; do
            echo "========== BUILD: $p =========="
            if ./scripts/run-docker.sh ./build-package.sh -a aarch64 -f "$p"; then
              echo "OK: $p"
            else
              echo "FAIL: $p (continue)"
            fi
          done
          find "$(pwd)" -name '*_aarch64.deb' -type f > /tmp/debs.list || true
          cat /tmp/debs.list
          if [ ! -s /tmp/debs.list ]; then
            echo "No .deb produced — fail"
            exit 1
          fi

      - name: Install dpkg-dev
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev

      - name: Stage debs into apt/
        run: |
          set -e
          MAIN=repo/apt/termux-main
          mkdir -p "$MAIN/pool/main" "$MAIN/dists/stable/main/binary-aarch64"
          while IFS= read -r deb; do
            [ -z "$deb" ] && continue
            base=$(basename "$deb")
            name=$(echo "$base" | sed 's/_.*//')
            mkdir -p "$MAIN/pool/main/$name"
            cp -v "$deb" "$MAIN/pool/main/$name/"
          done < /tmp/debs.list
          cd "$MAIN"
          dpkg-scanpackages -m pool /dev/null > dists/stable/main/binary-aarch64/Packages
          gzip -9cf dists/stable/main/binary-aarch64/Packages > dists/stable/main/binary-aarch64/Packages.gz
          printf '%s\n' \
            'Origin: AI Builder Termux' \
            'Label: termux-main' \
            'Suite: stable' \
            'Codename: stable' \
            'Architectures: aarch64' \
            'Components: main' \
            'Description: App-compatible Termux packages for com.karat.aibuilder' \
            > Release
          cp Release dists/stable/Release
          head -40 dists/stable/main/binary-aarch64/Packages || true
          find pool -name '*.deb' | wc -l

      - name: Commit and push apt
        working-directory: repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apt/
          if git diff --staged --quiet; then
            echo "No apt changes"
            exit 0
          fi
          git commit -m "ci: auto-build aarch64 packages (${{ steps.pkgs.outputs.list }})"
          git push origin HEAD:${{ github.ref_name }}
