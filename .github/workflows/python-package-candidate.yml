name: Build and verify pinned Python package closure (no publication)

on:
  workflow_dispatch:
    inputs:
      retain_candidate_artifacts:
        description: Retain verified candidate bundle for 7 days (visible to authenticated repository readers)
        required: false
        type: boolean
        default: false
  push:
    branches:
      - work/toolchain-source-closure-candidates-20261016
    paths:
      - .github/workflows/python-package-candidate.yml
      - python-candidate-package-set.json
      - termux-package-source-scope.json
      - scripts/resolve-pinned-termux-recipe-closure.py
      - scripts/test-pinned-termux-recipe-closure.sh
      - scripts/create-ephemeral-feed-signing-key.sh
      - scripts/create-signed-feed-release.sh
      - scripts/test-signed-feed-smoke.sh
      - scripts/test-apt-candidate.sh
      - scripts/verify-candidate-dependency-closure.py
      - scripts/test-candidate-feed-policy.sh
      - scripts/test-candidate-dependency-closure.sh
      - termux-private-package-kit/python-v3.14.6/**
      - termux-private-package-kit/make-v476/patch_properties.py

permissions:
  contents: read

concurrency:
  group: aib-python-package-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-audit-and-test-python-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TERMUX_SOURCE_PIN: 505e06ef0c8dbd7611abfb90e9eb60826dcd01d7
      TERMUX_BUILDER_IMAGE_REF: ghcr.io/termux/package-builder@sha256:44999857244619e25bc8e3427904a16d36cc0c0e087704af039e5bdf94814ac9
      APP_DATA_DIR: /data/user/0/com.karat.aibuilder
      TERMUX_PREFIX: /data/user/0/com.karat.aibuilder/files/usr

    steps:
      - name: Checkout candidate branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install isolated signing and index tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg dpkg-dev

      - name: Run policy, syntax, candidate and unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          kit=termux-private-package-kit/python-v3.14.6
          bash -n scripts/create-ephemeral-feed-signing-key.sh scripts/create-signed-feed-release.sh scripts/test-signed-feed-smoke.sh scripts/test-apt-candidate.sh "$kit/build-python-private-aarch64.sh"
          python3 -m py_compile scripts/resolve-pinned-termux-recipe-closure.py scripts/verify-candidate-dependency-closure.py "$kit/audit_python_closure.py" "$kit/validate_python_feed.py"
          python3 -m unittest discover -s "$kit/tests" -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/pkg-config-v0.29.2/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/wget-v1.25.0/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/curl-v8.23.0/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/gh-v2.102.0/tests -p 'test_*.py' -v
          python3 -m unittest discover -s termux-private-package-kit/git-v2.56.0/tests -p 'test_*.py' -v
          ./scripts/test-candidate-feed-policy.sh
          ./scripts/test-candidate-dependency-closure.sh
          bash ./scripts/test-pinned-termux-recipe-closure.sh
          ./termux-private-package-kit/make-v476/verify-kit.sh
          ./scripts/test-signed-feed-smoke.sh

      - name: Checkout exact locked Termux source
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/termux-packages"
          mkdir -p "$source_dir"
          git -C "$source_dir" init
          git -C "$source_dir" remote add origin https://github.com/termux/termux-packages.git
          git -C "$source_dir" fetch --no-tags --depth=1 origin "$TERMUX_SOURCE_PIN"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$TERMUX_SOURCE_PIN"
          test -z "$(git -C "$source_dir" status --porcelain=v1)"

      - name: Resolve and verify the exact Python source closure (metadata only)
        shell: bash
        run: |
          set -Eeuo pipefail
          closure="$RUNNER_TEMP/aib-python-source-closure.json"
          python3 scripts/resolve-pinned-termux-recipe-closure.py \
            --source-root "$RUNNER_TEMP/termux-packages" \
            --scope "$GITHUB_WORKSPACE/termux-package-source-scope.json" \
            --profile python-candidate > "$closure"
          test "$(sha256sum "$closure" | awk '{print $1}')" = fee7f54aab5e120b377abbb503e704380a478162e8025bb9d975f5bdbd372ad6
          test "$(sha256sum python-candidate-package-set.json | awk '{print $1}')" = 8f40ee6821be530834d1efe2b138d9949c15a486bb14631e2f0c2e76f737be62
          python3 - "$closure" python-candidate-package-set.json "$RUNNER_TEMP/termux-packages/packages/python/build.sh" <<'PY'
          import json,pathlib,re,sys
          closure=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          recipe=pathlib.Path(sys.argv[3]).read_text(encoding='utf-8')
          fields=('recipePath','recipeSha256','packageType','parentPackage','parentDependencyRule','subpackagePath','subpackageSha256','sourceVersionExpression','sourceRevisionExpression','versionExpressionIsLiteral','revisionExpressionIsLiteral','dependencyGroups','recommendationGroupsNotIncludedInRequiredClosure')
          actual={x['name']:{k:x[k] for k in fields} for x in closure['packages']}
          expected={x['name']:{k:x[k] for k in fields} for x in manifest['packages']}
          assert closure['sourceCommit']==manifest['source']['commit']=='505e06ef0c8dbd7611abfb90e9eb60826dcd01d7'
          assert closure['profile']=='python-candidate' and closure['rootPackages']==['python']
          assert closure['packageCount']==manifest['sourceClosure']['expectedPackageCount']==17
          assert closure['dependencyAlternativeCount']==manifest['sourceClosure']['expectedDependencyAlternativeCount']==25
          assert actual==expected
          python=next(x for x in closure['packages'] if x['name']=='python')
          assert {x['name'] for group in python['dependencyGroups'] for x in group}=={'gdbm','libandroid-posix-semaphore','libandroid-support','libbz2','libcrypt','libexpat','libffi','liblzma','libsqlite','ncurses','ncurses-ui-libs','openssl','readline','zlib','zstd'}
          assert {x['name'] for group in python['recommendationGroupsNotIncludedInRequiredClosure'] for x in group}=={'python-ensurepip-wheels','python-pip'}
          assert re.search(r'^TERMUX_PKG_BUILD_DEPENDS="tk"$',recipe,re.M)
          assert re.search(r'^TERMUX_PKG_RECOMMENDS="python-ensurepip-wheels, python-pip"$',recipe,re.M)
          assert manifest['runtimeDependencies']['buildOnlyDependencies']==['tk']
          assert 'tk' not in {x['name'] for x in closure['packages']}
          assert all(x['name']!='python-tkinter' for x in closure['packages'])
          print('PINNED_PYTHON_RECIPE_CLOSURE_OK packages=17 dependency_alternatives=25 build_only=tk recommendations_excluded=2')
          PY

      - name: Pull digest-pinned official Termux builder
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          docker pull "$TERMUX_BUILDER_IMAGE_REF"
          docker image inspect "$TERMUX_BUILDER_IMAGE_REF" --format '{{.Id}}' >/dev/null

      - name: Build pinned closure and statically audit every candidate deb
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="$RUNNER_TEMP/aib-private-python-candidate-output"
          raw_log="$RUNNER_TEMP/aib-private-python-candidate-build.log"
          mkdir -p "$output_dir"
          set +e
          AIB_TERMUX_APP_DATA_DIR="$APP_DATA_DIR" \
          AIB_TERMUX_PREFIX="$TERMUX_PREFIX" \
          AIB_TERMUX_BUILDER_IMAGE_REF="$TERMUX_BUILDER_IMAGE_REF" \
            "$GITHUB_WORKSPACE/termux-private-package-kit/python-v3.14.6/build-python-private-aarch64.sh" \
              "$RUNNER_TEMP/termux-packages" "$GITHUB_WORKSPACE/python-candidate-package-set.json" "$output_dir" >"$raw_log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::error title=Python candidate build or audit failed::Exit $build_status; a sanitized log tail follows. No binary was uploaded."
            python3 - "$raw_log" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          for value,replacement in ((sys.argv[2],'<RUNNER_TEMP>'),(sys.argv[3],'<WORKSPACE>'),('/home/builder/termux-packages','<BUILDER_SOURCE>'),('/data/user/0/com.karat.aibuilder/files/usr','<MODELED_PREFIX>'),('/data/user/0/com.karat.aibuilder','<MODELED_APP_DATA>'),('/data/data/com.karat.aibuilder','<MODELED_APP_DATA>')): log=log.replace(value,replacement)
          log=re.sub(r'(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+|-----BEGIN [^-]*PRIVATE KEY-----|AIB_TERMUX_FEED_SIGNING_KEY|GITHUB_TOKEN|GH_TOKEN)','<REDACTED_SECRET>',log)
          print('--- sanitized last 100 build-log lines ---')
          for line in log.splitlines()[-100:]: print(line[:600])
          PY
            exit "$build_status"
          fi
          python3 - "$output_dir/build-result.json" "$output_dir/audit-report.json" <<'PY'
          import json,pathlib,sys
          build=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          audit=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert build['status']=='audit-passed; device-runtime-test-not-run'
          assert build['sourceCommit']=='505e06ef0c8dbd7611abfb90e9eb60826dcd01d7'
          assert build['sourceClosure']['profile']=='python-candidate' and build['sourceClosure']['rootPackages']==['python'] and build['sourceClosure']['buildTargetPackage']=='python' and build['sourceClosure']['packageCount']==17
          assert build['sourceClosure']['dependencyAlternativeCount']==25 and build['sourceClosure']['buildOnlyDependencies']==['tk']
          assert len(build['packages'])==17 and audit['ok'] is True and audit['candidatePackageCount']==17
          assert audit['sourceClosurePackageCount']==17 and audit['sourceClosureDependencyAlternativeCount']==25
          assert build['installed'] is False and build['deviceSmokeTest']=='NOT RUN' and build['rollback']=='NOT RUN'
          assert build['prefixProvenance']=='ci-model-only; device-observation-not-run'
          print('PINNED_BUILD_AND_STATIC_AUDIT_OK packages=17 root=python ci_prefix=model_only device_install=NOT_RUN')
          PY

      - name: Create ephemeral signed candidate feed and simulate exact Python APT closure
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="$RUNNER_TEMP/aib-private-python-candidate-output"
          feed="$RUNNER_TEMP/aib-python-candidate-feed"
          key_root="$RUNNER_TEMP/aib-python-candidate-signing-config"
          closure="$output_dir/source-closure.json"
          mkdir -p "$feed/dists/stable/main/binary-aarch64"
          ./scripts/create-ephemeral-feed-signing-key.sh "$key_root"
          export AIB_TERMUX_FEED_SIGNING_CONFIG_ROOT="$key_root"
          export GNUPGHOME="$key_root/gnupg"
          while IFS= read -r -d '' deb; do
            package="$(dpkg-deb -f "$deb" Package)"
            mkdir -p "$feed/pool/main/$package"
            cp -- "$deb" "$feed/pool/main/$package/"
          done < <(find "$output_dir/packages" -maxdepth 1 -type f -name '*.deb' -print0)
          (cd "$feed" && dpkg-scanpackages -m pool /dev/null > dists/stable/main/binary-aarch64/Packages)
          gzip -n -9c "$feed/dists/stable/main/binary-aarch64/Packages" > "$feed/dists/stable/main/binary-aarch64/Packages.gz"
          python3 ./scripts/verify-candidate-dependency-closure.py \
            --package-set python-candidate-package-set.json \
            --packages-index "$feed/dists/stable/main/binary-aarch64/Packages"
          ./scripts/create-signed-feed-release.sh "$feed" aarch64 >"$RUNNER_TEMP/aib-python-feed-signing.log" 2>&1 || {
            echo 'ERROR:PYTHON_CANDIDATE_FEED_SIGNING_OR_INTEGRITY_CHECK_FAILED' >&2; exit 2;
          }
          python3 termux-private-package-kit/python-v3.14.6/validate_python_feed.py \
            --package-set python-candidate-package-set.json \
            --source-closure "$closure" \
            --feed-root "$feed" \
            --build-result "$output_dir/build-result.json" \
            --audit-report "$output_dir/audit-report.json" \
            --prefix "$TERMUX_PREFIX"
          ./scripts/test-apt-candidate.sh "$feed" aarch64 python 3.14.6-1 17
          ./scripts/test-signed-feed-smoke.sh
          python_sha="$(python3 - "$output_dir/build-result.json" <<'PY'
          import json,pathlib,sys
          print(next(p['sha256'] for p in json.loads(pathlib.Path(sys.argv[1]).read_text())['packages'] if p['name']=='python'))
          PY
          )"
          {
            echo '## Pinned Python candidate closure (temporary CI-only feed)'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo '| Exact upstream commit, recipe/subpackage locks and source checksums | PASS |'
            echo '| Required Python runtime closure | PASS; 25 dependency alternatives; 17 candidate packages; tk is build-only; recommendations excluded |'
            echo '| App-private payload paths, licenses, AArch64 ELF and complete library providers | PASS; 17 package audits |'
            echo '| Exact candidate Depends/Pre-Depends closure | PASS; all runtime packages declared; no undeclared dependencies |'
            echo '| Ephemerally signed APT feed and simulated Python install | PASS; install not performed |'
            echo '| Python package SHA-256 | `'$python_sha'` |'
            echo '| Device install / rollback | NOT RUN |'
            echo '| Public artifact / production feed / Pages / GitHub Release | NONE / BLOCKED |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage verified candidate artifacts and provenance
        if: success() && inputs.retain_candidate_artifacts
        shell: bash
        env:
          CANDIDATE_OUTPUT: ${{ runner.temp }}/aib-private-python-candidate-output
          CANDIDATE_FEED: ${{ runner.temp }}/aib-python-candidate-feed
          CANDIDATE_KEYROOT: ${{ runner.temp }}/aib-python-candidate-signing-config
          CANDIDATE_MANIFEST: ${{ github.workspace }}/python-candidate-package-set.json
          BUILDER_IMAGE_REF: ${{ env.TERMUX_BUILDER_IMAGE_REF }}
          SOURCE_COMMIT: ${{ env.TERMUX_SOURCE_PIN }}
          BUNDLE_DIR: ${{ runner.temp }}/candidate-retention-bundle
        run: python3 scripts/stage-candidate-retention.py
      - name: Upload verified candidate bundle (7 days)
        if: success() && inputs.retain_candidate_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-python-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-retention-bundle/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary source, package, signature and signing material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf -- \
            "$RUNNER_TEMP/termux-packages" \
            "$RUNNER_TEMP/aib-private-python-candidate-output" \
            "$RUNNER_TEMP/aib-private-python-candidate-build.log" \
            "$RUNNER_TEMP/aib-python-candidate-feed" \
            "$RUNNER_TEMP/aib-python-candidate-signing-config" \
            "$RUNNER_TEMP/aib-python-feed-signing.log" \
            "$RUNNER_TEMP/aib-python-source-closure.json"
