name: Publish apt to gh-pages branch

on:
  push:
    branches: [main, master]
    paths:
      - "apt/**"
      - ".github/workflows/gh-pages-branch.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Termux packages (auto)"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: true

jobs:
  publish:
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare publish tree
        run: |
          set -e
          rm -rf /tmp/site
          mkdir -p /tmp/site
          # root of Pages site = content of apt/ so URL is shorter optional;
          # keep apt/ prefix for sources.list compatibility:
          cp -a apt /tmp/site/
          # index for humans
          cat > /tmp/site/index.html << 'HTML'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>AI Builder apt</title></head>
          <body>
          <h1>TERMUX_APP_PACKAGE apt</h1>
          <p>Feed:</p>
          <pre>deb https://argus-94.github.io/TERMUX_APP_PACKAGE/apt/termux-main stable main</pre>
          <p><a href="apt/termux-main/dists/stable/main/binary-aarch64/Packages">Packages index</a></p>
          </body></html>
          HTML
          # fix leading spaces in heredoc
          sed -i 's/^          //' /tmp/site/index.html
          ls -laR /tmp/site/apt/termux-main/dists 2>/dev/null | head -30

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
